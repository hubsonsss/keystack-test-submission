services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: keystack
      POSTGRES_PASSWORD: keystack123
      POSTGRES_DB: keystack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystack"]
      interval: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://keystack:keystack123@db:5432/keystack
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
